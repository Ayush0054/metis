name: Metis Workflow
description: Run configurable GitHub workflows powered by TypeSafe AI's Jev model.
branding:
  icon: inbox
  color: purple
inputs:
  typesafe-api-key:
    description: TypeSafe API key, supplied from a repository secret.
    required: true
  github-token:
    description: GitHub token with permissions required by the selected workflows.
    default: ${{ github.token }}
  model:
    description: TypeSafe model name or alias.
    default: jev-latest
  config-path:
    description: Optional plain JSON settings for workflow-file.
    default: ''
  manifest-path:
    description: JSON manifest containing workflow class file paths.
    default: ''
  workflow:
    description: Optional name to select from manifest-path.
    default: ''
  workflow-file:
    description: Trusted Python file exporting a Workflow class, from the base checkout.
    default: ''
  dry-run:
    description: Pass dry_run to the workflow. Write steps must honor it before external changes.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Run Metis workflows
      shell: bash
      env:
        METIS_ACTION_PATH: ${{ github.action_path }}
        METIS_CONFIG_PATH: ${{ inputs.config-path }}
        METIS_MANIFEST_PATH: ${{ inputs.manifest-path }}
        METIS_WORKFLOW: ${{ inputs.workflow }}
        METIS_WORKFLOW_FILE: ${{ inputs.workflow-file }}
        METIS_DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        TYPESAFE_DEFAULT_MODEL: ${{ inputs.model }}
      run: python3 "$METIS_ACTION_PATH/scripts/run_workflow.py"
