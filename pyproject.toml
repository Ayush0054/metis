[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "metis-workflow"
version = "0.1.1"
description = "Composable workflow orchestration powered by TypeSafe AI Jev"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ayush Jha" }]
keywords = ["workflows", "github", "triage", "typesafe", "jev"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
metis-workflow = "metis_workflow.cli:main"

[project.urls]
Homepage = "https://github.com/Ayush0054/metis"
Repository = "https://github.com/Ayush0054/metis"
Issues = "https://github.com/Ayush0054/metis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/metis_workflow"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/examples", "/docs", "/pyproject.toml", "/README.md", "/LICENSE"]
